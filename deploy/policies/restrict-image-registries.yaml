apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Workloads in enforced namespaces may only run images built by the Aegis
      pipeline, so nothing from Docker Hub or other registries can sneak in.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        aegis.dev/policy: enforced
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.image.startsWith('ghcr.io/ahmedelgmal310/aegis-'))
      messageExpression: >-
        'image ' + variables.allContainers.filter(c, !c.image.startsWith('ghcr.io/ahmedelgmal310/aegis-'))[0].image +
        ' is not from the trusted registry ghcr.io/ahmedelgmal310/aegis-*'

spec:
  automountServiceAccountToken: false
  containers:
    - name: ledger
      image: ghcr.io/ahmedelgmal310/aegis-ledger:main
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: 250m
          memory: 64Mi
---

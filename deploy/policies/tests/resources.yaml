apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: aegis
spec:
  automountServiceAccountToken: false
  containers:
    - name: ledger
      image: ghcr.io/ahmedelgmal310/aegis-ledger@sha256:4b0f2ca3a3e4bd5f4a6e7b2d1f6b2a5f2c8a6c8f4b0a5e3d2c1b0a9f8e7d6c5b
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: 250m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dockerhub-pod
  namespace: aegis
spec:
  automountServiceAccountToken: false
  containers:
    - name: web
      image: docker.io/library/nginx@sha256:4b0f2ca3a3e4bd5f4a6e7b2d1f6b2a5f2c8a6c8f4b0a5e3d2c1b0a9f8e7d6c5b
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: 250m
          memory: 64Mi
---

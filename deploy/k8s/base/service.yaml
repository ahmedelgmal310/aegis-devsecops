apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: aegis
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: aegis
  labels:
    app.kubernetes.io/name: ledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ledger
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger
  namespace: aegis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: aegis
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/part-of: aegis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ledger
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          # Replaced with an immutable, signed digest by kustomize/Argo CD.
          image: ghcr.io/ahmedelgmal310/aegis-ledger:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The token is mounted as a file, never exposed as an env var.
            - name: LEDGER_API_TOKEN_FILE
              value: /var/run/secrets/ledger/token
            - name: GOMEMLIMIT
              value: "48MiB"
          volumeMounts:
            - name: api-token
              mountPath: /var/run/secrets/ledger
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: api-token
          secret:
            secretName: ledger-api
            defaultMode: 0440
            items:
              - key: token
                path: token
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ledger

apiVersion: v1
kind: Service
metadata:
  name: aegis-responder
  namespace: aegis-response
  labels:
    app.kubernetes.io/name: aegis-responder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-responder
  ports:
    - name: alerts
      port: 8443
      targetPort: alerts
      protocol: TCP
    - name: ops
      port: 9090
      targetPort: ops
      protocol: TCP

version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
    - whitespace
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests talk to local httptest servers on purpose.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
